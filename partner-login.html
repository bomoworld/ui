  <body>
    <!-- <div id="guest-header-module"></div> -->

    <main>
      <div class="min-h-screen bg-slate-950">
        <div class="grid min-h-screen lg:grid-cols-[1fr_520px]">
          <!-- LEFT -->
          <div
            class="relative hidden lg:flex flex-col justify-center overflow-hidden px-16"
          >
            <div
              class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(249,115,22,0.18),transparent_30%),radial-gradient(circle_at_bottom_right,rgba(59,130,246,0.12),transparent_30%)]"
            ></div>

            <div class="relative z-10 max-w-2xl">
              <div
                class="inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-orange-400 backdrop-blur-xl"
              >
                BOMO Partner Manager
              </div>

              <h1 class="mt-8 text-6xl font-black leading-[1.05] text-white">
                Hospitality Operations
                <span class="text-orange-400"> Simplified </span>
              </h1>

              <p class="mt-6 max-w-xl text-lg leading-relaxed text-slate-400">
                Manage bookings, properties, guests, revenue, payouts, and daily
                operations from a single platform.
              </p>
            </div>
          </div>

          <!-- RIGHT -->
          <div
            class="flex items-center justify-center px-6 py-10 sm:px-8 bg-slate-500/40"
          >
            <div class="w-full max-w-md">
              <div
                class="rounded-[32px] border border-white/10 bg-white p-8 shadow-[0_20px_80px_rgba(0,0,0,0.15)] sm:p-10"
              >
                <!-- LOGO -->
                <div
                  class="mb-8 flex h-16 w-16 items-center justify-center rounded-3xl bg-orange-100"
                >
                  <i class="fa-solid fa-building text-2xl text-orange-600"></i>
                </div>

                <!-- HEADER -->
                <div class="mb-8">
                  <h2 class="text-4xl font-black text-slate-900">
                    Welcome Back
                  </h2>

                  <p class="mt-2 text-sm text-slate-500">
                    Sign in to continue to your dashboard.
                  </p>
                </div>

                <!-- GOOGLE -->
                <button
                  id="googleLoginBtn"
                  type="button"
                  class="flex w-full items-center justify-center gap-3 rounded-2xl border border-slate-300 bg-white px-5 py-3.5 font-medium text-slate-700 transition hover:bg-slate-50"
                >
                  <i class="fa-brands fa-google text-red-500"></i>

                  Continue with Google
                </button>

                <!-- DIVIDER -->
                <div class="relative my-7">
                  <div class="border-t border-slate-200"></div>

                  <span
                    class="absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/2 bg-white px-4 text-xs text-slate-400"
                  >
                    OR
                  </span>
                </div>

                <!-- FORM -->
                <form id="partnerLoginForm" class="space-y-5">
                  <div>
                    <label
                      class="mb-2 block text-sm font-medium text-slate-700"
                    >
                      Email Address
                    </label>

                    <div class="relative">
                      <i
                        class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                      ></i>

                      <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        class="w-full rounded-2xl border border-slate-300 py-3.5 pl-12 pr-4 outline-none transition focus:border-orange-500 focus:ring-4 focus:ring-orange-100"
                      />
                    </div>
                  </div>

                  <div>
                    <div class="mb-2 flex items-center justify-between">
                      <label class="text-sm font-medium text-slate-700">
                        Password
                      </label>

                      <a
                        href="auth.html?page=forgot-password"
                        class="text-sm text-blue-600 hover:text-orange-500"
                      >
                        Forgot Password?
                      </a>
                    </div>

                    <div class="relative">
                      <i
                        class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                      ></i>

                      <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        class="w-full rounded-2xl border border-slate-300 py-3.5 pl-12 pr-12 outline-none transition focus:border-orange-500 focus:ring-4 focus:ring-orange-100"
                      />

                      <button
                        id="togglePassword"
                        type="button"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"
                      >
                        <i id="passwordIcon" class="fa-regular fa-eye"></i>
                      </button>
                    </div>
                  </div>

                  <label
                    class="flex cursor-pointer items-center gap-3 text-sm text-slate-600"
                  >
                    <input
                      type="checkbox"
                      class="h-4 w-4 rounded border-slate-300"
                    />

                    Remember me
                  </label>

                  <a href="hotel-manager-dashboard.html">
                    <div
                      class="text-center w-full rounded-2xl bg-orange-500 py-3.5 font-semibold text-white transition hover:bg-orange-600"
                    >
                      Sign In
                    </div>
                  </a>
                </form>

                <!-- FOOTER -->
                <div class="mt-8 border-t border-slate-100 pt-6 text-center">
                  <p class="text-sm text-slate-500">
                    Need a partner account?

                    <a
                      href="enlist-property.html"
                      class="font-semibold text-blue-600 hover:text-orange-500"
                    >
                      Register Property
                    </a>
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

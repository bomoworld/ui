<!-- Legacy guest topbar retained for reference; the unified shell owns navigation. -->
<header class="fixed left-0 right-0 top-4 z-50 px-5 lg:px-8">
  <div
    class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 rounded-2xl border border-slate-200/90 bg-white/95 px-3 shadow-[0_12px_36px_rgba(15,23,42,.08)] backdrop-blur-xl dark:border-slate-800 dark:bg-slate-950/95 dark:shadow-[0_12px_36px_rgba(0,0,0,.35)] sm:px-4">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <a href="?pgid=dashboard" data-page="dashboard" class="shrink-0" aria-label="Open guest dashboard">
        <img src="../assets/images/logo.png" alt="BOMO" class="h-11 w-auto dark:hidden xl:h-12" />

        <img src="../assets/images/logo_dark_v.png" alt="BOMO"
          class="hidden h-11 w-auto rounded-xl object-contain dark:block xl:h-12" />
      </a>

      <div class="hidden border-l border-slate-200 pl-3 sm:block dark:border-slate-700">
        <span class="block text-[10px] font-semibold uppercase tracking-[.14em] text-slate-400">Guest</span>
        <strong class="mt-0.5 block text-xs font-bold text-slate-800 dark:text-slate-100">Dashboard</strong>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="hidden items-center gap-2 lg:flex">
      <a href="?pgid=dashboard" data-page="dashboard"
        class="guest-nav flex items-center gap-2 rounded-xl px-4 py-2 text-slate-700 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
        <i class="fa-solid fa-house"></i>

        <span>Dashboard</span>
      </a>

      <a href="?pgid=bookings" data-page="bookings"
        class="guest-nav flex items-center gap-2 rounded-xl px-4 py-2 text-slate-700 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
        <i class="fa-solid fa-suitcase"></i>

        <span>Trips</span>
      </a>

      <a href="?pgid=reviews" data-page="reviews"
        class="guest-nav flex items-center gap-2 rounded-xl px-4 py-2 text-slate-700 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
        <i class="fa-solid fa-camera"></i>

        <span>Reviews</span>
      </a>

      <a href="?pgid=messages" data-page="messages"
        class="guest-nav flex items-center gap-2 rounded-xl px-4 py-2 text-slate-700 transition-colors hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
        <i class="fa-solid fa-comments"></i>

        <span>Messages</span>
      </a>
      <a href="./index.html"
        class="group/studio ml-1 flex items-center gap-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 py-2 pl-2 pr-4 text-white shadow-[0_8px_22px_rgba(249,115,22,.3)] ring-1 ring-orange-400/30 transition duration-200 hover:-translate-y-0.5 hover:from-orange-600 hover:to-orange-700 hover:shadow-[0_12px_28px_rgba(249,115,22,.38)] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-orange-200">
        <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-white/15">
          <i class="fa-solid fa-camera-shutter text-xs"></i>
        </span>
        <span class="font-semibold">Travel Studio</span>
        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-orange-100 transition group-hover/studio:translate-x-0.5 group-hover/studio:-translate-y-0.5"></i>
      </a>
    </nav>

    <!-- Profile -->
    <div class="flex items-center gap-3">
      <a href="./index.html" aria-label="Open Travel Studio"
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-orange-500 to-orange-600 text-white shadow-lg shadow-orange-500/25 ring-1 ring-orange-400/30 transition hover:-translate-y-0.5 hover:from-orange-600 hover:to-orange-700 lg:hidden">
        <i class="fa-solid fa-camera-shutter"></i>
      </a>

      <button type="button" data-guest-theme-toggle aria-label="Switch to dark mode"
        aria-pressed="false" title="Switch to dark mode"
        class="group/theme flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:border-blue-200 hover:bg-blue-50 hover:text-blue-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-200/70 dark:border-slate-700 dark:bg-slate-900 dark:text-amber-300 dark:hover:border-slate-600 dark:hover:bg-slate-800 dark:hover:text-amber-200 dark:focus-visible:ring-blue-900/70">
        <i class="fa-solid fa-moon transition-transform duration-200 group-hover/theme:-rotate-12"
          data-guest-theme-icon aria-hidden="true"></i>
        <span class="sr-only" data-guest-theme-label>Switch to dark mode</span>
      </button>

      <div class="group relative">
        <button type="button" aria-label="Open account menu"
          class="flex items-center gap-3 rounded-2xl border border-slate-200 py-2 pl-2 pr-3 transition-colors hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800">
          <img src="https://i.pravatar.cc/100?img=12" class="h-9 w-9 rounded-full" alt="Rick Grimes" />

          <div class="hidden text-left md:block">
            <div class="text-sm font-semibold text-slate-900 dark:text-white">
              Rick Grimes
            </div>

            <div class="text-xs text-slate-500 dark:text-slate-400">
              Guest Account
            </div>
          </div>

          <i class="fa-solid fa-chevron-down text-xs text-slate-400 dark:text-slate-500"></i>
        </button>

        <!-- Dropdown -->
        <div
          class="invisible absolute right-0 top-full mt-2 w-72 translate-y-1 rounded-2xl border border-slate-200 bg-white p-1.5 opacity-0 shadow-2xl transition-all group-hover:visible group-hover:translate-y-0 group-hover:opacity-100 group-focus-within:visible group-focus-within:translate-y-0 group-focus-within:opacity-100 dark:border-slate-800 dark:bg-slate-900">
          <!-- User -->
          <div class="border-b border-slate-100 p-4 dark:border-slate-800">
            <div class="font-semibold text-slate-900 dark:text-white">
              Rick Grimes
            </div>

            <div class="text-sm text-slate-500 dark:text-slate-400">
              rick@example.com
            </div>
          </div>

          <!-- Menu -->
          <a href="?pgid=profile" data-page="profile"
            class="flex items-center gap-3 px-4 py-3 text-slate-700 transition hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800">
            <i class="fa-solid fa-user w-5"></i>

            My Profile
          </a>

          <a href="?pgid=wishlist" data-page="wishlist"
            class="flex items-center gap-3 px-4 py-3 text-slate-700 transition hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800">
            <i class="fa-solid fa-heart w-5"></i>

            Wishlist
          </a>

          <a href="?pgid=wishlist#recently-viewed" data-page="wishlist"
            class="flex items-center gap-3 px-4 py-3 text-slate-700 transition hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800">
            <i class="fa-solid fa-clock-rotate-left w-5"></i>

            Recently Viewed
          </a>

          <a href="?pgid=messages" data-page="messages"
            class="flex items-center gap-3 px-4 py-3 text-slate-700 transition hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800">
            <i class="fa-solid fa-comments w-5"></i>

            Messages
          </a>
          <a href="./index.html"
            class="m-1 flex items-center gap-3 rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 px-3 py-3 text-white shadow-md shadow-orange-500/20 transition hover:from-orange-600 hover:to-orange-700">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/15"><i
                class="fa-solid fa-camera-shutter"></i></span>
            <span class="min-w-0 flex-1"><strong class="block text-sm">Travel Studio</strong><small
                class="mt-0.5 block text-orange-100">Create and manage travel content</small></span>
            <i class="fa-solid fa-arrow-right text-xs text-orange-100"></i>
          </a>

          <div class="border-t border-slate-100 dark:border-slate-800"></div>

          <a href="../auth.html?page=login"
            class="flex items-center gap-3 px-4 py-3 text-red-600 transition hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-500/10">
            <i class="fa-solid fa-right-from-bracket w-5"></i>

            Logout
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="bomo-card rounded-[30px] p-6 sm:p-7 lg:p-8">
  <!-- HEADER -->
  <div class="mb-7">
    <h2 class="text-3xl font-black text-slate-900">Create Account</h2>

    <p class="text-sm text-slate-500 mt-2">
      Register and access your booking dashboard.
    </p>
  </div>

  <!-- SOCIAL -->
  <div class="space-y-3">
    <button
      class="social-btn w-full flex items-center justify-center gap-3 font-medium text-sm"
    >
      <i class="fa-brands fa-google text-red-500"></i>

      Continue with Google
    </button>

    <button
      class="social-btn w-full flex items-center justify-center gap-3 font-medium text-sm"
    >
      <i class="fa-brands fa-apple text-black text-lg"></i>

      Continue with Apple
    </button>
  </div>

  <!-- DIVIDER -->
  <div class="relative my-8">
    <div class="border-t border-slate-200"></div>

    <span
      class="absolute left-1/2 -translate-x-1/2 -top-3 bg-white px-4 text-[11px] tracking-[0.25em] text-slate-400"
    >
      OR
    </span>
  </div>

  <!-- FORM -->
  <form class="space-y-5">
    <!-- FULL NAME -->
    <div>
      <label class="text-sm font-semibold text-slate-700"> Full Name </label>

      <div class="relative mt-2">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
          <i class="fa-solid fa-user"></i>
        </span>

        <input
          type="text"
          placeholder="Enter your full name"
          class="bomo-input text-center pl-11"
        />
      </div>
    </div>

    <!-- EMAIL -->
    <div>
      <label class="text-sm font-semibold text-slate-700">
        Email Address
      </label>

      <div class="relative mt-2">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
          <i class="fa-solid fa-envelope"></i>
        </span>

        <input
          type="email"
          placeholder="Enter your email"
          class="bomo-input text-center pl-11"
        />
      </div>
    </div>

    <!-- PASSWORD -->
    <div>
      <label class="text-sm font-semibold text-slate-700"> Password </label>

      <div class="relative mt-2">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
          <i class="fa-solid fa-lock"></i>
        </span>

        <input
          type="password"
          placeholder="Create password"
          class="bomo-input text-center pl-11 pr-12"
        />

        <button
          type="button"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"
        >
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div>
      <label class="text-sm font-semibold text-slate-700">
        Confirm Password
      </label>

      <div class="relative mt-2">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
          <i class="fa-solid fa-lock"></i>
        </span>

        <input
          type="password"
          placeholder="Confirm password"
          class="bomo-input text-center pl-11 pr-12"
        />

        <button
          type="button"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"
        >
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
    </div>

    <!-- TERMS -->
    <label class="flex items-start gap-3 text-sm text-slate-600 cursor-pointer">
      <input type="checkbox" class="mt-1 w-4 h-4 rounded border-slate-300" />

      <span> I agree to the Terms of Service and Privacy Policy </span>
    </label>

    <!-- BUTTON -->
    <button type="submit" class="w-full bomo-btn-primary font-semibold">
      Create Account
    </button>
  </form>

  <!-- FOOTER -->
  <div class="text-center mt-8">
    <p class="text-sm text-slate-500">
      Already have an account?

      <a
        href="auth.html?page=login"
        class="font-semibold text-blue-700 hover:text-orange-500 transition"
      >
        Login
      </a>
    </p>
  </div>
</div>

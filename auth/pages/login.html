<div class="bomo-card rounded-[30px] p-6 sm:p-7 lg:p-8">
  <div class="mb-7">
    <h2 class="text-3xl font-black text-slate-900 dark:text-white">
      Login Account
    </h2>

    <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
      Enter your account credentials to continue.
    </p>
  </div>

  <!-- SOCIAL -->
  <div class="space-y-3">
    <button
      class="social-btn w-full flex items-center justify-center gap-3 font-medium text-sm"
    >
      <i class="fa-brands fa-google text-red-500 text-base"></i>

      <span class="dark:text-slate-200"> Continue with Google </span>
    </button>
  </div>

  <!-- DIVIDER -->
  <div class="relative my-8">
    <div class="border-t border-slate-200 dark:border-slate-700"></div>

    <span
      class="absolute left-1/2 -translate-x-1/2 -top-3 bg-white dark:bg-slate-900 px-4 text-[11px] tracking-[0.25em] text-slate-400 dark:text-slate-500"
    >
      OR
    </span>
  </div>

  <!-- FORM -->
  <form class="space-y-5">
    <!-- EMAIL -->
    <div>
      <label class="text-sm font-semibold text-slate-700 dark:text-slate-200">
        Email Address
      </label>

      <div class="relative mt-2">
        <span
          class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"
        >
          <i class="fa-solid fa-envelope"></i>
        </span>

        <input
          type="email"
          placeholder="Enter your email"
          class="bomo-input text-center pl-11"
        />
      </div>
    </div>

    <!-- PASSWORD -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="text-sm font-semibold text-slate-700 dark:text-slate-200">
          Password
        </label>

        <a
          href="auth.html?page=forgot-password"
          class="text-sm text-blue-700 dark:text-blue-400 hover:text-orange-500 transition"
        >
          Forgot Password?
        </a>
      </div>

      <div class="relative">
        <span
          class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"
        >
          <i class="fa-solid fa-lock"></i>
        </span>

        <input
          type="password"
          placeholder="Enter your password"
          class="bomo-input text-center pl-11 pr-12"
        />

        <button
          type="button"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-slate-700 dark:hover:text-white transition"
        >
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>
    </div>

    <!-- REMEMBER -->
    <div class="flex items-center justify-between">
      <label
        class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-400 cursor-pointer"
      >
        <input
          type="checkbox"
          class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800"
        />

        Remember me
      </label>
    </div>

    <!-- BUTTON -->
    <a href="travel-studio/">
      <div class="w-full bomo-btn-primary font-semibold">Login Account</div>
    </a>
  </form>

  <!-- FOOTER -->
  <div class="text-center mt-8">
    <p class="text-sm text-slate-500 dark:text-slate-400">
      Don't have an account?

      <a
        href="auth.html?page=register"
        class="font-semibold text-blue-700 dark:text-blue-400 hover:text-orange-500 transition"
      >
        Create Account
      </a>
    </p>
  </div>
</div>

<section class="bg-white rounded-[32px] overflow-hidden">
  <!-- HEADER -->
  <div class="ic">Search available rooms within this property</div>
  <div class="p-6 border-b border-slate-100">
    <div class="flex items-start justify-between">
      <div>
        <div class="text-sm text-slate-500">Starting from</div>

        <div class="mt-1 flex items-end gap-2">
          <span class="text-4xl font-bold text-slate-900"> ₱4,850 </span>

          <span class="text-slate-500 mb-1"> / night </span>
        </div>
      </div>

      <div class="px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold">
        Available
      </div>
    </div>

    <div class="flex items-center gap-2 mt-3 text-sm text-slate-500">
      <i class="fa-solid fa-fire text-orange-500"></i>

      3 rooms left for your dates
    </div>
  </div>

  <!-- FORM -->

  <div class="p-6 space-y-4">
    <div class="grid md:grid-cols-2 gap-4">
      <!-- CHECK IN -->

      <button data-open-booking class="group bg-slate-50 hover:bg-slate-100 rounded-3xl p-5 text-left transition">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs uppercase tracking-wide text-slate-500">
              Check In
            </div>

            <div class="font-semibold text-lg mt-1">Jun 12</div>

            <div class="text-sm text-emerald-600 mt-1">
              Lowest price this week
            </div>
          </div>

          <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center">
            <i class="fa-regular fa-calendar"></i>
          </div>
        </div>

        <div class="mt-4 flex items-center gap-2">
          <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-xs">
            ₱4,850
          </span>

          <span class="px-3 py-1 rounded-full bg-blue-50 text-blue-900 text-xs">
            Available
          </span>
        </div>
      </button>

      <!-- CHECK OUT -->

      <button data-open-booking class="group bg-slate-50 hover:bg-slate-100 rounded-3xl p-5 text-left transition">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs uppercase tracking-wide text-slate-500">
              Check Out
            </div>

            <div class="font-semibold text-lg mt-1">Jun 15</div>

            <div class="text-sm text-slate-500 mt-1">3 nights stay</div>
          </div>

          <div class="w-12 h-12 rounded-2xl bg-white flex items-center justify-center">
            <i class="fa-regular fa-calendar"></i>
          </div>
        </div>

        <div class="mt-4 flex items-center gap-2">
          <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 text-xs">
            Available
          </span>
        </div>
      </button>
    </div>

    <div>
      <label class="text-xs font-medium text-slate-500"> Guests </label>

      <select class="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-900">
        <option>2 Guests</option>
        <option>3 Guests</option>
        <option>4 Guests</option>
      </select>
    </div>

    <button data-open-booking
      class="w-full bg-blue-900 hover:bg-blue-800 text-white py-4 rounded-2xl font-semibold transition">
      Check Availability
    </button>
  </div>

  <!-- BOMO LIVE STATUS -->

  <div class="px-6 pb-6">
    <div class="bg-slate-50 rounded-2xl p-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm font-semibold">BOMO Live Status</div>

          <div class="text-xs text-slate-500 mt-1">
            Real-time booking activity
          </div>
        </div>

        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
      </div>

      <div class="mt-4 space-y-3 text-sm">
        <div class="flex justify-between">
          <span class="text-slate-500"> Last booked </span>

          <span> 12 mins ago </span>
        </div>

        <div class="flex justify-between">
          <span class="text-slate-500"> Views today </span>

          <span> 187 </span>
        </div>

        <div class="flex justify-between">
          <span class="text-slate-500"> Occupancy </span>

          <span> 91% </span>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOKING CONFIDENCE -->

  <div class="px-6 pb-6">
    <div class="flex flex-wrap gap-2">
      <span class="px-3 py-1.5 rounded-full bg-slate-100 text-xs text-slate-700">
        Free Cancellation
      </span>

      <span class="px-3 py-1.5 rounded-full bg-slate-100 text-xs text-slate-700">
        Instant Confirmation
      </span>

      <span class="px-3 py-1.5 rounded-full bg-slate-100 text-xs text-slate-700">
        Secure Payment
      </span>
    </div>
  </div>
</section>

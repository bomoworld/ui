<section class="relative bg-slate-50">
  <!-- Cover -->
  <div class="relative h-[260px] lg:h-[320px] overflow-hidden">
    <img
      src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2400&auto=format&fit=crop"
      class="absolute inset-0 h-full w-full object-cover"
      alt=""
    />

    <div class="absolute inset-0 bg-black/15"></div>

    <div
      class="absolute inset-0 bg-gradient-to-t from-slate-50 via-transparent to-transparent"
    ></div>
  </div>

  <!-- Profile Card -->
  <div class="relative max-w-[1400px] mx-auto px-6 -mt-24">
    <div
      class="overflow-hidden rounded-[32px] border border-slate-200 shadow-[0_24px_80px_rgba(15,23,42,.08)]"
    >
      <div class="p-8 lg:p-10">
        <div
          class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-10"
        >
          <!-- Partner -->
          <div class="flex gap-6">
            <img
              src="https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?q=80&w=700&auto=format&fit=crop"
              class="w-32 h-32 rounded-[28px] object-cover ring-4 ring-white shadow-xl"
              alt=""
            />

            <div class="flex-1">
              <span
                class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-4 py-2 text-sm font-medium text-emerald-700"
              >
                <i class="fa-solid fa-circle-check"></i>
                Verified Partner
              </span>

              <h1 class="mt-5 text-4xl lg:text-5xl font-bold text-slate-900">
                BOMO Beach Resort
              </h1>

              <div
                class="mt-4 flex flex-wrap items-center gap-6 text-sm text-slate-600"
              >
                <span class="flex items-center gap-2">
                  <i class="fa-solid fa-location-dot text-blue-600"></i>
                  Boracay, Philippines
                </span>

                <span class="flex items-center gap-2">
                  <i class="fa-solid fa-star text-amber-400"></i>
                  4.9 Rating
                </span>

                <span class="flex items-center gap-2">
                  <i class="fa-solid fa-comment-dots text-blue-600"></i>
                  2,184 Reviews
                </span>
              </div>

              <p class="mt-5 max-w-2xl text-slate-600 leading-7">
                Premium beachfront accommodations with verified stays, curated
                experiences and exceptional guest service.
              </p>
            </div>
          </div>

          <!-- Booking -->
          <div
            class="xl:w-[320px] rounded-3xl border border-slate-200 bg-slate-50 p-6"
          >
            <div class="text-sm text-slate-500">Starting from</div>

            <div class="mt-1">
              <span class="text-4xl font-bold text-slate-900"> ₱3,250 </span>

              <span class="text-slate-500"> /night </span>
            </div>

            <button
              data-tab="partner-rooms"
              class="partner-scroll bomo-btn-primary"
            >
              View Accommodations
            </button>
          </div>
        </div>
      </div>

      <!-- Statistics -->
      <div
        class="grid grid-cols-2 lg:grid-cols-4 border-t border-slate-200 bg-slate-50"
      >
        <div class="p-6 text-center">
          <div class="text-3xl font-bold text-slate-900">24</div>
          <div class="mt-1 text-sm text-slate-500">Accommodations</div>
        </div>

        <div class="p-6 text-center border-l border-slate-200">
          <div class="text-3xl font-bold text-slate-900">12</div>
          <div class="mt-1 text-sm text-slate-500">Properties</div>
        </div>

        <div class="p-6 text-center border-l border-slate-200">
          <div class="text-3xl font-bold text-slate-900">4.9</div>
          <div class="mt-1 text-sm text-slate-500">Guest Rating</div>
        </div>

        <div class="p-6 text-center border-l border-slate-200">
          <div class="text-3xl font-bold text-slate-900">2018</div>
          <div class="mt-1 text-sm text-slate-500">Partner Since</div>
        </div>
      </div>
    </div>
  </div>
</section>

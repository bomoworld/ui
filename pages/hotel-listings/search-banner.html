<!-- HOTEL SEARCH + ADVANCED FILTERS -->
<section
  class="sticky top-[74px] lg:top-[80px] z-40 backdrop-blur-xl border-b border-slate-200 "
>
  <div class="max-w-[1500px] mx-auto px-4 lg:px-6 py-4">
    <div class="hotel-card !p-4">
      <!-- MAIN SEARCH -->
      <form data-listings-search>
        <div
          class="grid grid-cols-2 md:grid-cols-5 xl:grid-cols-[2.5fr_1fr_1fr_1.2fr_auto] gap-3"
        >
          <!-- DESTINATION -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-2">
              Destination
            </label>

            <div
              class="relative h-[58px] rounded-2xl border-2 border-slate-200 bg-white shadow-sm hover:border-orange-300 focus-within:border-orange-500 focus-within:ring-4 focus-within:ring-orange-100 transition"
            >
              <i
                class="fa-solid fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-orange-500"
              ></i>

              <input
                type="text"
                name="location"
                data-listings-location
                placeholder="City, Property, Landmark"
                class="w-full h-full bg-transparent pl-11 pr-4 outline-none font-medium"
              />
            </div>
          </div>

          <!-- CHECK IN -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-2">
              Check In
            </label>

            <input
              type="date"
              name="checkin"
              data-listings-checkin
              class="w-full h-[58px] rounded-2xl border-2 border-slate-200 bg-white px-4 font-medium shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-4 focus:ring-orange-100 outline-none transition"
            />
          </div>

          <!-- CHECK OUT -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-2">
              Check Out
            </label>

            <input
              type="date"
              name="checkout"
              data-listings-checkout
              class="w-full h-[58px] rounded-2xl border-2 border-slate-200 bg-white px-4 font-medium shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-4 focus:ring-orange-100 outline-none transition"
            />
          </div>

          <!-- GUESTS -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-2">
              Guests & Rooms
            </label>

            <select
              name="guests"
              class="w-full h-[58px] rounded-2xl border-2 border-slate-200 bg-white px-4 font-medium shadow-sm hover:border-orange-300 focus:border-orange-500 focus:ring-4 focus:ring-orange-100 outline-none transition"
            >
              <option>2 Guests • 1 Room</option>
            </select>
          </div>

          <!-- SEARCH -->
          <div class="flex items-end">
            <button
              type="submit"
              class="w-full xl:w-[180px] h-[58px] rounded-2xl bg-slate-800 hover:bg-slate-900 text-white font-semibold shadow-lg shadow-slate-500/30 transition"
            >
              <i class="fa-solid fa-magnifying-glass mr-2"></i>
              Search
            </button>
          </div>
        </div>
      </form>
      </div>

       <!-- FILTER CHIPS -->
      <div
        class=" pt-5  flex flex-wrap items-center gap-2"
      >
        <span class="text-sm font-semibold text-slate-500 mr-2">
          Popular Filters
        </span>

        <button
          class="px-4 py-2 rounded-full bg-white hover:border-orange-400 hover:bg-orange-50 transition text-sm font-medium"
        >
          Free Cancellation
        </button>

        <button
          class="px-4 py-2 rounded-full bg-white hover:border-orange-400 hover:bg-orange-50 transition text-sm font-medium"
        >
          Breakfast Included
        </button>

        <button
          class="px-4 py-2 rounded-full border border-orange-200 bg-orange-50 text-orange-600 text-sm font-medium"
        >
          Pool
        </button>

        <button
          class="px-4 py-2 rounded-full bg-white hover:border-orange-400 hover:bg-orange-50 transition text-sm font-medium"
        >
          WiFi
        </button>

        <button
          class="px-4 py-2 rounded-full bg-white hover:border-orange-400 hover:bg-orange-50 transition text-sm font-medium"
        >
          Beachfront
        </button>
 
      </div>

       
    </div>
  </div>
</section>

<section id="availabilityCalendar" class="availability-calendar">
  <header class="calendar-toolbar">
    <div class="calendar-title-group">
      <h2>Calendar</h2>
      <button id="clearCalendarDates" class="calendar-clear-button" type="button">
        Clear dates
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <div class="calendar-toolbar-actions">
      <button class="calendar-feedback-link" type="button" id="calendarFeedback">
        Send feedback
      </button>

      <label class="calendar-select-control">
        <span class="sr-only">Room type</span>
        <select id="calendarRoomFilter">
          <option value="all">All room types</option>
          <option value="studio">Studio Suite</option>
          <option value="deluxe">Deluxe Room</option>
          <option value="room-only">Room Only</option>
        </select>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </label>

      <label class="calendar-select-control calendar-select-primary">
        <span class="sr-only">Rate plan</span>
        <select id="calendarRateFilter">
          <option value="all">All rate plans</option>
          <option value="flexible">Flexible</option>
          <option value="standard">Standard</option>
          <option value="non-refundable">Non-refundable</option>
        </select>
        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
      </label>

      <label class="calendar-month-picker" title="Jump to month">
        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
        <input id="calendarMonthPicker" type="month" aria-label="Jump to month" />
      </label>
    </div>
  </header>

  <div class="calendar-notice" role="note">
    <div>
      <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
      <span>Select one date or a date range to update room availability and rates.</span>
    </div>
    <button id="calendarTodayButton" type="button">Go to today</button>
  </div>

  <div class="calendar-workspace">
    <main class="calendar-main">
      <div class="calendar-month-navigation">
        <button id="calendarPreviousMonth" type="button" aria-label="Show previous month">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <p id="calendarRangeLabel" aria-live="polite"></p>
        <button id="calendarNextMonth" type="button" aria-label="Show next month">
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <div id="calendarMonths" class="calendar-months"></div>
    </main>

    <aside class="calendar-editor" aria-label="Selected date availability editor">
      <div class="calendar-editor-header">
        <strong id="calendarSelectionCount">1 date selected</strong>
        <span id="calendarUnsavedState">Draft</span>
      </div>

      <div class="calendar-date-fields">
        <label>
          <span>Start date</span>
          <div class="calendar-date-input">
            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
            <input id="calendarStartDate" type="date" />
          </div>
        </label>

        <label>
          <span>End date</span>
          <div class="calendar-date-input">
            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
            <input id="calendarEndDate" type="date" />
          </div>
        </label>
      </div>

      <button
        id="calendarWeekdayToggle"
        class="calendar-weekday-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="calendarWeekdayOptions"
      >
        <span>
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          Specify day of the week
        </span>
        <span id="calendarWeekdaySummary">All days</span>
      </button>

      <div id="calendarWeekdayOptions" class="calendar-weekday-options" hidden>
        <p>Apply changes only to:</p>
        <div id="calendarWeekdayButtons" class="calendar-weekday-buttons"></div>
      </div>

      <div id="calendarRoomEditor" class="calendar-room-editor"></div>

      <div class="calendar-save-bar">
        <button id="calendarClearSelection" type="button">Clear</button>
        <button id="calendarSaveChanges" type="button">
          <i class="fa-regular fa-floppy-disk" aria-hidden="true"></i>
          Save changes
        </button>
      </div>
    </aside>
  </div>

  <div id="calendarToast" class="calendar-toast" role="status" aria-live="polite"></div>
</section>

<script>
  (() => {
    const root = document.getElementById("availabilityCalendar");
    if (!root) return;

    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNames = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December",

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const roomState = {
      studio: {
        id: "studio",
        name: "Studio Suite",
        code: "8472847",
        guests: 2,
        status: "closed",
        availability: 0,
        previousAvailability: 1,
        rate: 7599,
      },
      deluxe: {
        id: "deluxe",
        name: "Deluxe Room",
        code: "536972",
        guests: 2,
        status: "open",
        availability: 3,
        previousAvailability: 3,
        rate: 7599,
      },
      "room-only": {
        id: "room-only",
        name: "Room Only",
        code: "536973",
        guests: 2,
        status: "closed",
        availability: 0,
        previousAvailability: 1,
        rate: 7599,
      },
    };

    const state = {
      viewStart: new Date(today.getFullYear(), today.getMonth(), 1),
      rangeStart: formatIsoDate(today),
      rangeEnd: formatIsoDate(today),
      selectedDates: new Set([formatIsoDate(today)]),
      selectedWeekdays: new Set([0, 1, 2, 3, 4, 5, 6]),
      roomFilter: "all",
      rateFilter: "all",
      collapsedRooms: new Set(),
      toastTimer: null,
    };

    const elements = {
      months: root.querySelector("#calendarMonths"),
      rangeLabel: root.querySelector("#calendarRangeLabel"),
      monthPicker: root.querySelector("#calendarMonthPicker"),
      startDate: root.querySelector("#calendarStartDate"),
      endDate: root.querySelector("#calendarEndDate"),
      selectionCount: root.querySelector("#calendarSelectionCount"),
      weekdayToggle: root.querySelector("#calendarWeekdayToggle"),
      weekdayOptions: root.querySelector("#calendarWeekdayOptions"),
      weekdayButtons: root.querySelector("#calendarWeekdayButtons"),
      weekdaySummary: root.querySelector("#calendarWeekdaySummary"),
      roomEditor: root.querySelector("#calendarRoomEditor"),
      roomFilter: root.querySelector("#calendarRoomFilter"),
      rateFilter: root.querySelector("#calendarRateFilter"),
      unsavedState: root.querySelector("#calendarUnsavedState"),
      toast: root.querySelector("#calendarToast"),
    };

    function formatIsoDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function parseIsoDate(value) {
      if (!value) return null;
      const parts = value.split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function addDays(date, amount) {
      const next = new Date(date);
      next.setDate(next.getDate() + amount);
      return next;
    }

    function getMonthKey(date) {
      return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
    }

    function getRate() {
      if (state.rateFilter === "flexible") return 8199;
      if (state.rateFilter === "non-refundable") return 6999;
      return 7599;
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat("en-PH", {
        style: "currency",
        currency: "PHP",
        maximumFractionDigits: 0,
      }).format(value);
    }

    function getDayAvailability(date) {
      const day = date.getDate();
      if (day === 11) return { status: "full", availability: 0 };
      if (day === 21) return { status: "closed", availability: 0 };
      return {
        status: "open",
        availability: ((day * 3 + date.getMonth()) % 10) + 1,
      };
    }

    function buildMonth(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthSection = document.createElement("section");
      monthSection.className = "calendar-month";

      const title = document.createElement("h3");
      title.className = "calendar-month-title";
      title.textContent = monthNames[month] + " " + year;
      monthSection.appendChild(title);

      const weekdayGrid = document.createElement("div");
      weekdayGrid.className = "calendar-week-grid";
      dayNames.forEach((name) => {
        const label = document.createElement("div");
        label.className = "calendar-weekday";
        label.textContent = name;
        weekdayGrid.appendChild(label);
      });
      monthSection.appendChild(weekdayGrid);

      const daysGrid = document.createElement("div");
      daysGrid.className = "calendar-days-grid";

      for (let blank = 0; blank < firstDay; blank += 1) {
        const empty = document.createElement("div");
        empty.className = "calendar-day-blank";
        empty.setAttribute("aria-hidden", "true");
        daysGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const current = new Date(year, month, day);
        const iso = formatIsoDate(current);
        const availability = getDayAvailability(current);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        button.dataset.date = iso;
        button.setAttribute(
          "aria-label",
          monthNames[month] + " " + day + ", " + year + ", " +
            (availability.status === "open"
              ? availability.availability + " rooms available"
              : availability.status),
        );

        if (current.getDay() === 0) button.classList.add("is-sunday");
        if (current.getDay() === 6) button.classList.add("is-saturday");
        if (current.getTime() === today.getTime()) button.classList.add("is-today");
        if (state.selectedDates.has(iso)) button.classList.add("is-selected");
        if (
          state.rangeStart &&
          state.rangeEnd &&
          iso > state.rangeStart &&
          iso < state.rangeEnd
        ) {
          button.classList.add("is-range");
        }
        if (availability.status === "closed") button.classList.add("is-closed");
        if (availability.status === "full") button.classList.add("is-full");

        const number = document.createElement("span");
        number.className = "calendar-day-number";
        number.textContent = day;
        button.appendChild(number);

        const details = document.createElement("span");
        details.className = "calendar-day-details";
        if (availability.status === "closed") {
          details.innerHTML = "<strong>Closed</strong>";
        } else if (availability.status === "full") {
          details.innerHTML = "<strong>Fully booked / Closed</strong>";
        } else {
          details.innerHTML =
            "<strong>" +
            availability.availability +
            " left</strong><span>" +
            formatCurrency(getRate()) +
            "</span>";
        }
        button.appendChild(details);
        daysGrid.appendChild(button);
      }

      const totalCells = firstDay + daysInMonth;
      const trailingBlanks = (7 - (totalCells % 7)) % 7;
      for (let blank = 0; blank < trailingBlanks; blank += 1) {
        const empty = document.createElement("div");
        empty.className = "calendar-day-blank";
        empty.setAttribute("aria-hidden", "true");
        daysGrid.appendChild(empty);
      }

      monthSection.appendChild(daysGrid);
      return monthSection;
    }

    function renderCalendars() {
      const secondMonth = new Date(
        state.viewStart.getFullYear(),
        state.viewStart.getMonth() + 1,
        1,
      );
      elements.months.replaceChildren(
        buildMonth(state.viewStart),
        buildMonth(secondMonth),
      );
      elements.rangeLabel.textContent =
        monthNames[state.viewStart.getMonth()].slice(0, 3) +
        " – " +
        monthNames[secondMonth.getMonth()].slice(0, 3) +
        " " +
        secondMonth.getFullYear();
      elements.monthPicker.value = getMonthKey(state.viewStart);
    }

    function selectRange(startValue, endValue) {
      const start = parseIsoDate(startValue);
      const end = parseIsoDate(endValue || startValue);
      if (!start || !end) {
        clearSelection();
        return;
      }

      const orderedStart = start <= end ? start : end;
      const orderedEnd = start <= end ? end : start;
      state.rangeStart = formatIsoDate(orderedStart);
      state.rangeEnd = formatIsoDate(orderedEnd);
      state.selectedDates.clear();

      for (
        let current = new Date(orderedStart);
        current <= orderedEnd;
        current = addDays(current, 1)
      ) {
        if (state.selectedWeekdays.has(current.getDay())) {
          state.selectedDates.add(formatIsoDate(current));
        }
      }

      markUnsaved();
      renderSelection();
    }

    function handleCalendarDate(dateValue) {
      if (!state.rangeStart || state.selectedDates.size !== 1) {
        state.selectedWeekdays = new Set([0, 1, 2, 3, 4, 5, 6]);
        selectRange(dateValue, dateValue);
        return;
      }

      if (state.rangeStart === dateValue && state.rangeEnd === dateValue) {
        clearSelection();
        return;
      }

      selectRange(state.rangeStart, dateValue);
    }

    function clearSelection() {
      state.rangeStart = "";
      state.rangeEnd = "";
      state.selectedDates.clear();
      state.selectedWeekdays = new Set([0, 1, 2, 3, 4, 5, 6]);
      markUnsaved();
      renderSelection();
    }

    function renderSelection() {
      const count = state.selectedDates.size;
      elements.selectionCount.textContent =
        count + (count === 1 ? " date selected" : " dates selected");
      elements.startDate.value = state.rangeStart;
      elements.endDate.value = state.rangeEnd;
      elements.endDate.min = state.rangeStart;
      root.querySelector("#clearCalendarDates").disabled = count === 0;
      root.querySelector("#calendarSaveChanges").disabled = count === 0;

      const allDaysSelected = state.selectedWeekdays.size === 7;
      elements.weekdaySummary.textContent = allDaysSelected
        ? "All days"
        : state.selectedWeekdays.size + " days";

      Array.from(elements.weekdayButtons.children).forEach((button) => {
        button.classList.toggle(
          "is-active",
          state.selectedWeekdays.has(Number(button.dataset.weekday)),
        );
      });

      renderCalendars();
      renderRoomEditor();
    }

    function roomCardTemplate(room) {
      const collapsed = state.collapsedRooms.has(room.id);
      const isOpen = room.status === "open";
      return (
        '<article class="calendar-room-card" data-room-card="' +
        room.id +
        '">' +
        '<div class="calendar-room-card-header">' +
        "<div><h4>" +
        room.name +
        " (" +
        room.code +
        ")</h4>" +
        '<p><i class="fa-regular fa-user"></i> ' +
        room.guests +
        " guests</p></div>" +
        '<button class="calendar-collapse-button' +
        (collapsed ? " is-collapsed" : "") +
        '" type="button" data-collapse-room="' +
        room.id +
        '" aria-label="' +
        (collapsed ? "Expand " : "Collapse ") +
        room.name +
        '"><i class="fa-solid fa-chevron-up"></i></button></div>' +
        '<div class="calendar-room-card-body"' +
        (collapsed ? " hidden" : "") +
        ">" +
        '<div class="calendar-room-fields"><div class="calendar-room-status">' +
        '<label><input type="radio" name="room-status-' +
        room.id +
        '" value="open" data-room-status="' +
        room.id +
        '"' +
        (isOpen ? " checked" : "") +
        "> Open</label>" +
        '<label><input type="radio" name="room-status-' +
        room.id +
        '" value="closed" data-room-status="' +
        room.id +
        '"' +
        (!isOpen ? " checked" : "") +
        "> Closed</label></div>" +
        '<label class="calendar-number-field"><span>Remaining availability</span>' +
        '<input type="number" min="0" max="99" value="' +
        room.availability +
        '" data-room-availability="' +
        room.id +
        '"' +
        (!isOpen ? " disabled" : "") +
        "></label></div>" +
        '<div class="calendar-rate-field"><span>' +
        (state.rateFilter === "all" ? "Standard rate" : state.rateFilter) +
        '</span><label class="calendar-number-field"><span>Rate (PHP)</span>' +
        '<input type="number" min="0" step="100" value="' +
        room.rate +
        '" data-room-rate="' +
        room.id +
        '"' +
        (!isOpen ? " disabled" : "") +
        "></label></div></div></article>"
      );
    }

    function renderRoomEditor() {
      const visibleRooms = Object.values(roomState).filter((room) => {
        return state.roomFilter === "all" || room.id === state.roomFilter;
      });
      const openRooms = visibleRooms.filter((room) => room.status === "open");
      const closedRooms = visibleRooms.filter((room) => room.status === "closed");
      let html = "";

      if (openRooms.length) {
        html +=
          '<section class="calendar-room-group"><h3 class="calendar-room-group-title">' +
          "Open rooms <span>" +
          openRooms.length +
          "</span></h3>" +
          openRooms.map(roomCardTemplate).join("") +
          "</section>";
      }

      if (closedRooms.length) {
        html +=
          '<section class="calendar-room-group is-closed"><h3 class="calendar-room-group-title">' +
          "Closed rooms <span>" +
          closedRooms.length +
          "</span></h3>" +
          closedRooms.map(roomCardTemplate).join("") +
          "</section>";
      }

      if (!html) {
        html =
          '<div class="calendar-room-group"><p class="text-sm text-slate-500">No rooms match this filter.</p></div>';
      }
      elements.roomEditor.innerHTML = html;
    }

    function markUnsaved() {
      elements.unsavedState.textContent = "Unsaved";
      elements.unsavedState.style.color = "#b26b00";
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("is-visible");
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => {
        elements.toast.classList.remove("is-visible");
      }, 2600);
    }

    dayNames.forEach((name, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "calendar-weekday-button is-active";
      button.dataset.weekday = index;
      button.textContent = name.slice(0, 1);
      button.title = name;
      elements.weekdayButtons.appendChild(button);
    });

    elements.months.addEventListener("click", (event) => {
      const dayButton = event.target.closest("[data-date]");
      if (dayButton) handleCalendarDate(dayButton.dataset.date);
    });

    root.querySelector("#calendarPreviousMonth").addEventListener("click", () => {
      state.viewStart = new Date(
        state.viewStart.getFullYear(),
        state.viewStart.getMonth() - 1,
        1,
      );
      renderCalendars();
    });

    root.querySelector("#calendarNextMonth").addEventListener("click", () => {
      state.viewStart = new Date(
        state.viewStart.getFullYear(),
        state.viewStart.getMonth() + 1,
        1,
      );
      renderCalendars();
    });

    elements.monthPicker.addEventListener("change", () => {
      const parts = elements.monthPicker.value.split("-").map(Number);
      if (parts.length === 2) {
        state.viewStart = new Date(parts[0], parts[1] - 1, 1);
        renderCalendars();
      }
    });

    root.querySelector("#calendarTodayButton").addEventListener("click", () => {
      state.viewStart = new Date(today.getFullYear(), today.getMonth(), 1);
      selectRange(formatIsoDate(today), formatIsoDate(today));
    });

    root.querySelector("#clearCalendarDates").addEventListener("click", clearSelection);
    root.querySelector("#calendarClearSelection").addEventListener("click", clearSelection);

    elements.startDate.addEventListener("change", () => {
      const start = elements.startDate.value;
      const end = elements.endDate.value || start;
      selectRange(start, end < start ? start : end);
    });

    elements.endDate.addEventListener("change", () => {
      const start = elements.startDate.value || elements.endDate.value;
      selectRange(start, elements.endDate.value);
    });

    elements.weekdayToggle.addEventListener("click", () => {
      const expanded = elements.weekdayToggle.getAttribute("aria-expanded") === "true";
      elements.weekdayToggle.setAttribute("aria-expanded", String(!expanded));
      elements.weekdayOptions.hidden = expanded;
    });

    elements.weekdayButtons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-weekday]");
      if (!button) return;
      const weekday = Number(button.dataset.weekday);
      if (state.selectedWeekdays.has(weekday) && state.selectedWeekdays.size > 1) {
        state.selectedWeekdays.delete(weekday);
      } else {
        state.selectedWeekdays.add(weekday);
      }
      selectRange(state.rangeStart, state.rangeEnd);
    });

    elements.roomFilter.addEventListener("change", () => {
      state.roomFilter = elements.roomFilter.value;
      renderRoomEditor();
    });

    elements.rateFilter.addEventListener("change", () => {
      state.rateFilter = elements.rateFilter.value;
      Object.values(roomState).forEach((room) => {
        room.rate = getRate();
      });
      markUnsaved();
      renderSelection();
    });

    elements.roomEditor.addEventListener("click", (event) => {
      const collapseButton = event.target.closest("[data-collapse-room]");
      if (!collapseButton) return;
      const roomId = collapseButton.dataset.collapseRoom;
      if (state.collapsedRooms.has(roomId)) {
        state.collapsedRooms.delete(roomId);
      } else {
        state.collapsedRooms.add(roomId);
      }
      renderRoomEditor();
    });

    elements.roomEditor.addEventListener("change", (event) => {
      const statusInput = event.target.closest("[data-room-status]");
      if (statusInput) {
        const room = roomState[statusInput.dataset.roomStatus];
        room.status = statusInput.value;
        if (room.status === "closed") {
          room.previousAvailability = room.availability || room.previousAvailability || 1;
          room.availability = 0;
        } else {
          room.availability = room.previousAvailability || 1;
        }
        markUnsaved();
        renderRoomEditor();
      }
    });

    elements.roomEditor.addEventListener("input", (event) => {
      const availabilityInput = event.target.closest("[data-room-availability]");
      const rateInput = event.target.closest("[data-room-rate]");
      if (availabilityInput) {
        roomState[availabilityInput.dataset.roomAvailability].availability = Math.max(
          0,
          Number(availabilityInput.value) || 0,
        );
        roomState[availabilityInput.dataset.roomAvailability].previousAvailability =
          Math.max(1, Number(availabilityInput.value) || 1);
        markUnsaved();
      }
      if (rateInput) {
        roomState[rateInput.dataset.roomRate].rate = Math.max(
          0,
          Number(rateInput.value) || 0,
        );
        markUnsaved();
      }
    });

    root.querySelector("#calendarSaveChanges").addEventListener("click", () => {
      if (!state.selectedDates.size) {
        showToast("Select at least one date before saving.");
        return;
      }

      const draft = {
        dates: Array.from(state.selectedDates),
        rangeStart: state.rangeStart,
        rangeEnd: state.rangeEnd,
        weekdays: Array.from(state.selectedWeekdays),
        ratePlan: state.rateFilter,
        rooms: roomState,
        savedAt: new Date().toISOString(),
      };

      elements.unsavedState.textContent = "Saved";
      elements.unsavedState.style.color = "#18814d";
      void draft;
      showToast(
        "Availability saved for " +
          state.selectedDates.size +
          (state.selectedDates.size === 1 ? " date." : " dates."),
      );
    });

    root.querySelector("#calendarFeedback").addEventListener("click", () => {
      showToast("Thanks — the feedback form will be available soon.");
    });

    renderSelection();
  })();
</script>
